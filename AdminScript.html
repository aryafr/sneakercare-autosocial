<script>
    // Mock Auth (In real app, use better security)
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'admin123';

    // State
    let allOrders = [];
    let currentFilter = 'Semua';
    let selectedOrderId = null;

    // Initialize
    window.addEventListener('load', () => {
        if (isLoggedIn()) {
            showMainApp();
        }

        // Set current date
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('id-ID', options);
    });

    // Login Logic
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;

        if (u === ADMIN_USER && p === ADMIN_PASS) {
            localStorage.setItem('sc_auth', 'true');
            showMainApp();
        } else {
            alert('Username atau Password salah!');
        }
    });

    function isLoggedIn() {
        return localStorage.getItem('sc_auth') === 'true';
    }

    function showMainApp() {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        loadDashboardData();
    }

    function logout() {
        if (confirm('Yakin ingin keluar?')) {
            localStorage.removeItem('sc_auth');
            location.reload();
        }
    }

    // Navigation
    function showAdminPage(pageId, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');

        if (el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        if (pageId === 'dashboard') loadDashboardData();
        if (pageId === 'orders') loadOrders();
    }

    // Data Loading
    function loadDashboardData() {
        google.script.run
            .withSuccessHandler(updateStats)
            .getDashboardStats();

        // Load recent orders too
        google.script.run
            .withSuccessHandler(renderRecentOrders)
            .getAllOrders('Semua');
    }

    function updateStats(response) {
        if (response.success) {
            const s = response.stats;
            animateValue('statOrderHariIni', s.orderHariIni);
            animateValue('statDalamProses', s.dalamProses);
            animateValue('statSelesaiHariIni', s.selesaiHariIni);
            document.getElementById('statRevenue').textContent = formatRupiah(s.pendapatanHariIni);
        }
    }

    function loadOrders() {
        document.getElementById('orderList').innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

        google.script.run
            .withSuccessHandler(orders => {
                allOrders = orders.success ? orders.orders : [];
                renderOrderList();
            })
            .getAllOrders('Semua'); // Load all first, then filter client-side
    }

    // Rendering
    function renderRecentOrders(response) {
        if (!response.success) return;
        const orders = response.orders.slice(0, 5); // Take top 5

        const html = orders.map(order => createOrderCard(order)).join('');
        document.getElementById('recentOrders').innerHTML = html;
    }

    function renderOrderList() {
        const container = document.getElementById('orderList');
        let filtered = allOrders;

        if (currentFilter !== 'Semua') {
            filtered = allOrders.filter(o => o.statusProgress === currentFilter);
        }

        if (filtered.length === 0) {
            container.innerHTML = '<div class="text-center text-muted py-5">Tidak ada order data.</div>';
            return;
        }

        container.innerHTML = filtered.map(order => createOrderCard(order)).join('');
    }

    function createOrderCard(order) {
        const badgeClass = getStatusBadge(order.statusProgress);

        return `
    <div class="order-card status-${order.statusProgress}" onclick="openDetail('${order.id}')">
      <div class="d-flex justify-content-between mb-2">
        <span class="fw-bold">${order.id}</span>
        <span class="badge ${badgeClass}">${order.statusProgress}</span>
      </div>
      <div class="mb-2">
        <h6 class="mb-0 fw-bold">${order.namaCustomer}</h6>
        <small class="text-muted">${order.detailSepatu}</small>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
        <span class="text-primary fw-bold">${formatRupiah(order.total)}</span>
        <small class="text-muted">${formatDate(order.tanggalMasuk)}</small>
      </div>
    </div>
  `;
    }

    function filterOrders(status) {
        currentFilter = status;

        // Update UI chips
        document.querySelectorAll('.filter-chip').forEach(btn => {
            if (btn.textContent === status) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        renderOrderList();
    }

    // Detail & Update
    function openDetail(orderId) {
        const order = allOrders.find(o => o.id === orderId);
        if (!order) return; // Should fetch if not found in list

        selectedOrderId = order.id;

        document.getElementById('detailOrderId').textContent = order.id;
        document.getElementById('detailTotal').textContent = formatRupiah(order.total);
        document.getElementById('detailCustomer').textContent = order.namaCustomer;
        document.getElementById('detailSepatu').textContent = order.detailSepatu;
        document.getElementById('detailTreatment').textContent = order.treatment;
        document.getElementById('detailPaymentStatus').textContent = order.statusBayar;
        document.getElementById('statusSelect').value = order.statusProgress;

        // WA Link
        let formattedPhone = order.noWhatsapp.toString().replace(/[^0-9]/g, '');
        if (formattedPhone.startsWith('0')) formattedPhone = '62' + formattedPhone.slice(1);
        const waMsg = `Halo Kak ${order.namaCustomer}, update untuk order ${order.id}: sdh ${order.statusProgress}`;
        document.getElementById('waLink').href = `https://wa.me/${formattedPhone}?text=${encodeURIComponent(waMsg)}`;

        new bootstrap.Modal(document.getElementById('orderDetailModal')).show();
    }

    function updateStatus() {
        const newStatus = document.getElementById('statusSelect').value;
        if (!selectedOrderId) return;

        const btn = document.querySelector('#orderDetailModal .btn-primary');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'Menyimpan...';

        google.script.run
            .withSuccessHandler(res => {
                btn.disabled = false;
                btn.innerHTML = originalText;

                if (res.success) {
                    // Update local state
                    const order = allOrders.find(o => o.id === selectedOrderId);
                    if (order) order.statusProgress = newStatus;

                    // Refresh views
                    renderOrderList();
                    loadDashboardData(); // Refresh stats

                    bootstrap.Modal.getInstance(document.getElementById('orderDetailModal')).hide();

                    // Optional: Ask to send WA notification
                    if (confirm('Status berhasil diupdate. Kirim notifikasi WhatsApp ke customer?')) {
                        document.getElementById('waLink').click();
                    }
                } else {
                    alert('Gagal update: ' + res.error);
                }
            })
            .updateOrderStatus(selectedOrderId, newStatus);
    }

    // Helpers
    function formatRupiah(amount) {
        return 'Rp ' + amount.toLocaleString('id-ID');
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    }

    function getStatusBadge(status) {
        if (status === 'Antrian') return 'bg-primary';
        if (status === 'Proses') return 'bg-warning text-dark';
        if (status === 'Selesai') return 'bg-success';
        return 'bg-secondary';
    }

    function animateValue(id, end) {
        const obj = document.getElementById(id);
        const start = 0;
        const duration = 1000;
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }
</script>
